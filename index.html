<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUNG KEY Tool - Tài Xỉu Sun.win AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.5);
            --red: #ef4444;
            --cyan: #06b6d4;
            --green: #10b981;
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --text-light: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body, html {
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b, var(--bg-dark));
            color: var(--text-light);
            overflow: hidden;
        }

        /* --- MÀN HÌNH KHÓA KEY ONLINE --- */
        #key-lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(25px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            padding: 20px; transition: all 0.3s ease;
        }
        .key-box {
            width: 100%; max-width: 400px;
            background: var(--panel-bg); border: 1px solid var(--neon-pink);
            border-radius: 24px; padding: 30px 20px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }
        .key-input {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; font-weight: bold;
            text-align: center; margin: 20px 0 10px 0; outline: none; letter-spacing: 2px;
        }
        .key-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .btn-verify {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 900; cursor: pointer;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); color: #fff;
            text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }
        #key-msg { font-size: 12px; margin-top: 10px; font-weight: bold; min-height: 18px; }

        /* --- GIAO DIỆN CHÍNH --- */
        #main-dashboard {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; position: absolute; top: 0; left: 0; z-index: 10;
            transition: all 0.4s ease; opacity: 0; pointer-events: none; transform: scale(0.9);
        }
        #main-dashboard.active { opacity: 1; pointer-events: auto; transform: scale(1); }

        .app-container {
            width: 100%; max-width: 450px; max-height: 90vh;
            background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.02);
            display: flex; flex-direction: column; gap: 20px; position: relative;
            overflow-y: auto; scrollbar-width: none;
        }
        .app-container::-webkit-scrollbar { display: none; }
        .app-container::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-pink), transparent, var(--neon-blue), transparent, var(--gold));
            z-index: -1; border-radius: 26px; animation: borderGlow 4s linear infinite;
        }
        @keyframes borderGlow { 0% { filter: blur(10px); opacity: 0.5; } 50% { filter: blur(20px); opacity: 1; } 100% { filter: blur(10px); opacity: 0.5; } }

        .header { text-align: center; }
        .header h1 {
            font-size: 26px; font-weight: 900; background: linear-gradient(to right, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px;
        }
        .neon-badge {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); color: white; font-size: 10px; font-weight: 900;
            padding: 3px 10px; border-radius: 20px; display: inline-block; margin-top: 5px;
        }

        .stats {
            display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 12px 15px;
            font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap; gap: 8px;
        }
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .win-rate { color: var(--green); text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        /* BỘ ĐẾM THỜI GIAN */
        .countdown-box {
            background: rgba(245, 158, 11, 0.1); border: 1px dashed var(--gold); border-radius: 12px;
            padding: 12px; text-align: center; font-size: 13px; font-weight: 800; color: var(--gold);
            text-transform: uppercase; letter-spacing: 0.5px; box-shadow: inset 0 0 10px rgba(251, 191, 36, 0.05);
        }

        .result-panel { background: rgba(255,255,255,0.02); border-radius: 16px; padding: 20px; text-align: center; }
        .dice-container { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        .dice {
            width: 55px; height: 55px; background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--gold); border-radius: 14px; display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: 900; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .predict-panel { text-align: center; padding: 25px; border-radius: 16px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
        .predict-result { font-size: 55px; font-weight: 900; letter-spacing: 4px; margin: 10px 0; }
        .pred-T { color: var(--cyan); text-shadow: 0 0 30px var(--cyan); }
        .pred-X { color: var(--red); text-shadow: 0 0 30px var(--red); }
        .pred-wait { color: #475569; font-size: 30px; }

        .history { display: flex; justify-content: flex-end; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .history::-webkit-scrollbar { display: none; }
        .hist-dot { min-width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 900; }
        .hist-T { background: var(--cyan); color: #000; }
        .hist-X { background: var(--red); color: #fff; }

        .btn-game {
            width: 100%; padding: 18px; border: none; border-radius: 14px; font-size: 16px; font-weight: 900;
            cursor: pointer; background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); color: #fff; text-transform: uppercase;
        }

        #game-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: none; background: #000; }
        #game-view iframe { width: 100%; height: 100%; border: none; }

        #miniTool {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px); border: 1px solid var(--neon-pink); border-radius: 30px; padding: 8px 15px;
            display: flex; align-items: center; gap: 12px; z-index: 999; cursor: grab; user-select: none;
        }
        .drag-handle { color: var(--neon-pink); font-size: 18px; padding-right: 5px; border-right: 1px solid rgba(255,255,255,0.2); }
        .mini-info { display: flex; flex-direction: column; }
        .mini-phien { font-size: 9px; color: #94a3b8; }
        .mini-pred { font-size: 18px; font-weight: 900; }
        .btn-close-game { background: #ef4444; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: 900; cursor: pointer; }
        .hide-main { transform: scale(0.8); opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH KHÓA KEY ONLINE -->
    <div id="key-lock-screen">
        <div class="key-box">
            <h2 style="color: var(--gold);">HUNG HIHOVIP</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Hệ thống xác thực thiết bị bảo mật</p>
            <input type="text" id="inputKeyField" class="key-input" placeholder="NHẬP KEY CỦA BẠN...">
            <button class="btn-verify" onclick="verifyKeyOnline()">Kích hoạt ngay</button>
            <div id="key-msg"></div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="main-dashboard">
        <div class="app-container">
            <div class="header">
                <h1>HUNG HIHOVIP TOOL</h1>
                <span class="neon-badge">⚡ TÀI XỈU AI VIP</span>
            </div>

            <div class="stats">
                <span id="botStatusText" style="color: var(--green);">● Đã kết nối máy chủ</span>
                <span class="win-rate" id="winRateMain">Độ chính xác: 0.0%</span>
            </div>

            <!-- BOX HIỂN THỊ ĐẾM THỜI GIAN -->
            <div class="countdown-box" id="timeRemainingText">
                ⏳ Đang kiểm tra thời hạn Key...
            </div>

            <div class="stats" style="justify-content: space-around;">
                <div class="stat-item">
                    <span style="color: #94a3b8;">🔥 Chuỗi thắng:</span>
                    <span style="color: var(--gold); font-weight: 900;" id="currentStreak">0</span>
                </div>
                <div class="stat-item">
                    <span style="color: #94a3b8;">🏆 Kỷ lục:</span>
                    <span style="color: var(--neon-pink); font-weight: 900;" id="maxStreak">0</span>
                </div>
            </div>

            <div class="result-panel">
                <div style="font-size: 14px; color: #cbd5e1; margin-bottom: 5px;" id="phienMain">Đang chờ dữ liệu...</div>
                <div class="dice-container">
                    <div class="dice" id="d1">-</div>
                    <div class="dice" id="d2">-</div>
                    <div class="dice" id="d3">-</div>
                </div>
                <div style="font-size: 16px; font-weight: 900;" id="tongMain">Tổng: -</div>
            </div>

            <div class="predict-panel">
                <div class="predict-title">DỰ ĐOÁN KẾT QUẢ</div>
                <div class="predict-result pred-wait" id="predMain">...</div>
            </div>

            <div>
                <div style="font-size: 11px; color: #94a3b8; margin-bottom: 5px;">LỊCH SỬ PHIÊN:</div>
                <div class="history" id="histMain"></div>
            </div>

            <button class="btn-game" onclick="openGame()">🎮 VÀO GAME NGAY</button>
        </div>
    </div>

    <!-- MÀN HÌNH GAME & MINI TOOL -->
    <div id="game-view">
        <iframe src="https://web.sunwin.show/?affId=Sunwin"></iframe>
        <div id="miniTool">
            <div class="drag-handle">⋮⋮</div>
            <div class="mini-info">
                <div class="mini-phien" id="miniPhien">Phiên tiếp: ...</div>
                <div class="mini-pred pred-wait" id="miniPred">CHỜ...</div>
            </div>
            <div style="font-size: 10px; color: var(--green); font-weight: bold; margin-left: 5px;" id="miniRate">0%</div>
            <button class="btn-close-game" onclick="closeGame()">×</button>
        </div>
    </div>

    <script>
        const BIN_ID = "6a45166ada38895dfe1c0e35";
        const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID + "/latest";
        const PUT_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;
        const API_URL = "https://various-collaborative-heights-sue.trycloudflare.com/api/tx";

        function getDeviceId() {
            let id = localStorage.getItem('hung_device_uid');
            if (!id) {
                id = 'DEV_' + Math.random().toString(36).substring(2, 11).toUpperCase();
                localStorage.setItem('hung_device_uid', id);
            }
            return id;
        }

        const myDeviceId = getDeviceId();
        let sessionKey = localStorage.getItem('hung_active_key') || "";

        window.addEventListener('DOMContentLoaded', function() {
            if (sessionKey) {
                document.getElementById('inputKeyField').value = sessionKey;
                silentCheckSession();
            }
        });

        function forceLogout(message) {
            localStorage.removeItem('hung_active_key');
            sessionKey = "";
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('main-dashboard').classList.remove('active');
            document.getElementById('main-dashboard').classList.remove('hide-main');
            
            const lockScreen = document.getElementById('key-lock-screen');
            lockScreen.style.display = 'flex'; 
            lockScreen.style.opacity = '1';
            
            const msgEl = document.getElementById('key-msg');
            msgEl.style.color = "var(--red)";
            msgEl.innerText = message || "Hết hạn!";
        }

        // BỘ ĐẾM THỜI GIAN CHẠY LIÊN TỤC VÀ KIỂM TRA HẠN KEY REALTIME
        function startRealtimeGuard() {
            setInterval(async function() {
                if (!sessionKey) {
                    return;
                }
                try {
                    const res = await fetch(JSONBIN_URL, { headers: { 'X-Bin-Meta': 'false' } });
                    if (!res.ok) return;
                    
                    const data = await res.json();
                    const keysData = data.keys_data || {};
                    const info = keysData[sessionKey];
                    
                    if (!info) { 
                        forceLogout("Key của bạn đã bị Admin XÓA khỏi hệ thống!"); 
                        return; 
                    }
                    if (!info.active_devices.includes(myDeviceId)) { 
                        forceLogout("Thiết bị của bạn đã bị ngắt quyền truy cập!"); 
                        return; 
                    }
                    
                    // Xử lý tính toán thời gian chuẩn xác từng giây
                    if (info.duration_ms !== -1 && info.start_time > 0) {
                        let timePassed = Date.now() - info.start_time;
                        let timeLeft = info.duration_ms - timePassed;
                        
                        if (timeLeft <= 0) {
                            forceLogout("Mã Key của bạn đã HẾT HẠN sử dụng!");
                        } else {
                            let hrs = Math.floor(timeLeft / 3600000);
                            let mins = Math.floor((timeLeft % 3600000) / 60000);
                            let secs = Math.floor((timeLeft % 60000) / 1000);
                            
                            // Xuất văn bản ra màn hình cho người dùng
                            document.getElementById('timeRemainingText').innerText = "⏳ CÒN LẠI: " + hrs + " Giờ " + mins + " Phút " + secs + " Giây";
                        }
                    } else if (info.duration_ms === -1) {
                        document.getElementById('timeRemainingText').innerText = "♾️ Hạn sử dụng: VĨNH VIỄN";
                    }
                } catch(e) {
                    console.log("Lỗi kết nối bảo vệ mạng.");
                }
            }, 1000); // Cập nhật đúng chu kỳ 1 giây/lần
        }

        async function silentCheckSession() {
            try {
                const res = await fetch(JSONBIN_URL, { headers: { 'X-Bin-Meta': 'false' } });
                if (!res.ok) return;
                const data = await res.json();
                const keysData = data.keys_data || {};
                if (keysData[sessionKey] && keysData[sessionKey].active_devices.includes(myDeviceId)) {
                    enterDashboard();
                } else { 
                    localStorage.removeItem('hung_active_key'); 
                }
            } catch(e) {}
        }

        function enterDashboard() {
            document.getElementById('key-lock-screen').style.opacity = '0';
            setTimeout(function() { 
                document.getElementById('key-lock-screen').style.display = 'none'; 
            }, 300);
            document.getElementById('main-dashboard').classList.add('active');
            fetchGameData(); 
            setInterval(fetchGameData, 5000);
            startRealtimeGuard();
        }

        async function verifyKeyOnline() {
            const inputKey = document.getElementById('inputKeyField').value.trim().toUpperCase();
            const msgEl = document.getElementById('key-msg');
            if (!inputKey) return;

            msgEl.style.color = "var(--gold)"; 
            msgEl.innerText = "Đang kiểm tra kết nối Server...";

            try {
                const response = await fetch(JSONBIN_URL, { method: 'GET', headers: { 'X-Bin-Meta': 'false' } });
                if (!response.ok) {
                    msgEl.style.color = "var(--red)"; msgEl.innerText = "Lỗi kết nối server Cloud!";
                    return;
                }
                const globalData = await response.json();
                let info = (globalData.keys_data || {})[inputKey];

                if (!info) { 
                    msgEl.style.color = "var(--red)"; msgEl.innerText = "Mã Key không tồn tại!"; 
                    return; 
                }

                if (info.duration_ms !== -1 && info.start_time > 0) {
                    if (Date.now() - info.start_time >= info.duration_ms) {
                        msgEl.style.color = "var(--red)"; msgEl.innerText = "Mã Key này đã hết hạn sử dụng!";
                        return;
                    }
                }

                if (!info.active_devices.includes(myDeviceId)) {
                    if (info.active_devices.length >= parseInt(info.max_devices)) {
                        msgEl.style.color = "var(--red)"; msgEl.innerText = "Key đã sử dụng đủ số lượng máy tối đa!"; 
                        return;
                    }
                    
                    if (info.start_time === 0) {
                        info.start_time = Date.now();
                    }

                    info.active_devices.push(myDeviceId);
                    globalData.keys_data[inputKey] = info;

                    await fetch(PUT_URL, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(globalData)
                    });
                }

                localStorage.setItem('hung_active_key', inputKey); 
                sessionKey = inputKey;
                enterDashboard();
            } catch (err) { 
                msgEl.style.color = "var(--red)"; msgEl.innerText = "Lỗi đường truyền mạng!"; 
            }
        }

        // --- HÀM KÉO THẢ DI CHUYỂN MINI TOOL ---
        const miniTool = document.getElementById('miniTool');
        let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        
        miniTool.addEventListener("touchstart", dragStart, {passive: false});
        miniTool.addEventListener("touchend", dragEnd, false);
        miniTool.addEventListener("touchmove", drag, {passive: false});
        miniTool.addEventListener("mousedown", dragStart, false);
        document.addEventListener("mouseup", dragEnd, false);
        document.addEventListener("mousemove", drag, false);

        function dragStart(e) {
            if (e.target.tagName.toLowerCase() === 'button') return;
            if (e.type === "touchstart") { 
                initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset; 
            } else { 
                initialX = e.clientX - xOffset; initialY = e.clientY - yOffset; 
            }
            isDragging = true;
        }
        function dragEnd(e) { initialX = currentX; initialY = currentY; isDragging = false; }
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                if (e.type === "touchmove") { 
                    currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY; 
                } else { 
                    currentX = e.clientX - initialX; currentY = e.clientY - initialY; 
                }
                xOffset = currentX; yOffset = currentY;
                miniTool.style.transform = "translate3d(" + currentX + "px, " + currentY + "px, 0)";
                miniTool.style.left = '50%'; miniTool.style.top = '20px';
            }
        }

        function openGame() { 
            document.getElementById('main-dashboard').classList.add('hide-main'); 
            setTimeout(function() { document.getElementById('game-view').style.display = 'block'; }, 300); 
        }
        function closeGame() { 
            document.getElementById('game-view').style.display = 'none'; 
            document.getElementById('main-dashboard').classList.remove('hide-main'); 
        }

        // --- ENGINE SOI CẦU AI GỐC HÙNG VIP ---
        const state = { last_phien: 0, history: [], win: 0, total_preds: 0, last_prediction: null, current_streak: 0, max_streak: 0 };
        
        function updateUI(data, nextPred) {
            document.getElementById('phienMain').innerText = "PHIÊN #" + data.phien;
            document.getElementById('d1').innerText = data.xuc_xac_1; 
            document.getElementById('d2').innerText = data.xuc_xac_2; 
            document.getElementById('d3').innerText = data.xuc_xac_3;
            
            let txtKq = data.ket_qua.includes("Tài") ? "Tài" : "Xỉu";
            document.getElementById('tongMain').innerText = "Tổng: " + data.tong + " (" + txtKq + ")";
            
            const accuracy = state.total_preds > 0 ? ((state.win / state.total_preds) * 100).toFixed(1) + '%' : '0.0%';
            document.getElementById('winRateMain').innerText = "Độ chính xác: " + accuracy;
            document.getElementById('currentStreak').innerText = state.current_streak;
            document.getElementById('maxStreak').innerText = state.max_streak;

            const predMain = document.getElementById('predMain'), miniPred = document.getElementById('miniPred');
            if (nextPred === 'T') { 
                predMain.innerText = 'TÀI'; predMain.className = 'predict-result pred-T'; 
                miniPred.innerText = 'TÀI'; miniPred.className = 'mini-pred pred-T'; 
            } else { 
                predMain.innerText = 'XỈU'; predMain.className = 'predict-result pred-X'; 
                miniPred.innerText = 'XỈU'; miniPred.className = 'mini-pred pred-X'; 
            }

            const histContainer = document.getElementById('histMain'); 
            histContainer.innerHTML = '';
            state.history.slice(-10).forEach(function(kq) {
                const div = document.createElement('div'); 
                div.className = "hist-dot hist-" + kq; 
                div.innerText = kq; 
                histContainer.appendChild(div);
            });
            document.getElementById('miniPhien').innerText = "Phiên tiếp: #" + (data.phien + 1);
            document.getElementById('miniRate').innerText = accuracy;
        }

        async function fetchGameData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (!data.phien || !data.ket_qua) return;
                
                const phien = data.phien;
                const ket_qua = data.ket_qua.includes("Tài") ? "T" : "X";

                if (state.last_phien !== 0 && phien > state.last_phien) {
                    state.history.push(ket_qua);
                    if (state.history.length > 20) state.history.shift();
                    if (state.last_prediction) {
                        state.total_preds++;
                        if (state.last_prediction === ket_qua) { 
                            state.win++; state.current_streak++; 
                            if (state.current_streak > state.max_streak) state.max_streak = state.current_streak; 
                        } else { 
                            state.current_streak = 0; 
                        }
                    }
                    const next_pred = predictNext(); 
                    state.last_prediction = next_pred; 
                    updateUI(data, next_pred);
                } else if (state.last_phien === 0) {
                    const next_pred = predictNext(); 
                    state.last_prediction = next_pred; 
                    updateUI(data, next_pred);
                }
                state.last_phien = phien;
            } catch (error) {}
        }

        function predictNext() {
            const historyStr = state.history.slice(-10).join("");
            const patterns = { "TXT": "X", "XXTTX": "X", "TTTXX": "X", "XTTXTT": "X", "XXXX": "X", "TTTT": "T", "TXTX": "T", "XXTTXX": "T" };
            for (let [pat, pred] of Object.entries(patterns)) { 
                if (historyStr.endsWith(pat)) return pred; 
            }
            return Math.random() > 0.5 ? "T" : "X";
        }
    </script>
