<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP ĐẾ VƯƠNG - LIÊN QUÂN</title>
    <style>
        body { background: #0d050a; color: #ff99cc; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .banner-code { background: linear-gradient(135deg, #2a0e1b, #5d0030); padding: 20px 10px; border-radius: 15px; border: 3px solid #ff3399; margin-bottom: 20px; }
        .banner-code h1 { color: #ffcc00; text-transform: uppercase; font-size: 24px; margin: 0; }
        .banner-code p { color: #fff; font-weight: bold; margin: 5px 0 0 0; font-size: 16px; }
        .container { background: #1f0a15; border: 2px solid #ff3399; border-radius: 15px; padding: 15px; }
        .btn { display: block; width: 100%; padding: 18px; margin: 10px 0; background: #cc3388; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; }
        #log { color: #fff; background: #440022; padding: 10px; font-size: 14px; margin-bottom: 10px; border-radius: 5px; }
        #history { color: #00ff00; background: #002200; padding: 10px; border: 1px solid #00ff00; border-radius: 8px; font-size: 14px; text-align: left; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="banner-code">
        <h1>SHOP ĐẾ VƯƠNG</h1>
        <p>LIÊN QUÂN - VIP & UY TÍN</p>
        <p>Chủ shop: NGÔ NGỌC HÙNG</p>
    </div>
    <div class="container">
        <div id="log">Đang tải dữ liệu...</div>
        <h2 id="bal" style="font-size: 22px;">Số dư: 0 VNĐ</h2>
        <button class="btn" onclick="nap()">1. NẠP MÃ CODE</button>
        <button class="btn" onclick="hanhDong('QUAY')">2. QUAY THƯỞNG</button>
        <button class="btn" onclick="hanhDong('MUA')">3. MUA ACC</button>
        
        <div id="admin-panel" style="display:none; margin-top:20px; border: 1px solid #fff; padding: 10px;">
            <button class="btn" style="background:#880044" onclick="adminAction('TAO')">TẠO MÃ</button>
            <button class="btn" style="background:#880044" onclick="adminAction('THEM')">THÊM ACC</button>
            <button class="btn" style="background:#880044" onclick="adminAction('GIA')">ĐỔI GIÁ</button>
            <button class="btn" style="background:#ff0000" onclick="adminAction('RESET')">RESET</button>
        </div>

        <h3 style="font-size: 18px;">LỊCH SỬ MUA ACC:</h3>
        <div id="history">Chưa có giao dịch.</div>
        <div onclick="moAdminBiMat()" style="margin-top:30px; font-size:12px; color:#666; cursor:pointer;">© Shop Đế Vương System</div>
    </div>

    <script>
        const B = "6a104353ee5a733b12ffcdf5";
        const KEY = "$2a$10$w2vogPsNVk6QlFdnS0ZCwuHcD/tdk9fPnLZB0fCAcJMGFBklvUyrS".trim();
        let d = null;
        async function load() {
            try {
                let r = await fetch("https://api.jsonbin.io/v3/b/"+B+"/latest");
                d = (await r.json()).record;
                document.getElementById('bal').innerText = "Số dư: " + (d.users?.User123?.balance || 0).toLocaleString('vi-VN') + " VNĐ";
                document.getElementById('history').innerText = d.history || "Chưa có giao dịch.";
            } catch(e) { }
        }
        load();
        async function luu(data) {
            let res = await fetch("https://api.jsonbin.io/v3/b/"+B, { method: "PUT", headers: {"Content-Type":"application/json", "X-Master-Key": KEY}, body: JSON.stringify(data) });
            if(res.ok) load();
        }
        function nap() { let c=prompt("Nhập mã:"); if(d.codes[c]&&d.codes[c].limit>0) { d.users.User123.balance += d.codes[c].val; d.codes[c].limit--; alert("Nạp thành công!"); luu(d); } else alert("Mã sai hoặc hết!"); }
        async function hanhDong(t) {
            if(t=='QUAY') {
                if(d.users.User123.balance < 10000) return alert("Thiếu tiền!");
                let r = Math.random()*100, v = (r < 3 ? 100000 : (r < 9 ? 50000 : (r < 21 ? 20000 : (r < 37 ? 10000 : 0))));
                d.users.User123.balance = d.users.User123.balance - 10000 + v;
                alert(v > 0 ? "Trúng " + v.toLocaleString('vi-VN') + " VNĐ!" : "Chúc may mắn!"); luu(d);
            } else {
                let k = Object.keys(d.accounts || {});
                if(k.length==0) return alert("Hết acc!");
                if(d.users.User123.balance < (d.giaAcc||400000)) return alert("Thiếu tiền!");
                let s = k[Math.floor(Math.random() * k.length)];
                d.users.User123.balance -= (d.giaAcc||400000);
                d.history = "Đã mua: " + d.accounts[s] + "\n" + (d.history || "");
                alert("MUA THÀNH CÔNG: " + d.accounts[s]);
                delete d.accounts[s]; luu(d);
            }
        }
        function moAdminBiMat() { if(prompt("Xác nhận Admin:") === "HUNGDEVUONG") document.getElementById('admin-panel').style.display = 'block'; }
        async function adminAction(type) {
            if(type=='TAO') { let m=prompt("Mã:"), v=prompt("Tiền:"), sl=prompt("SL:"); d.codes[m]={limit:parseInt(sl), val:parseInt(v)}; luu(d); }
            else if(type=='THEM') { let i=prompt("Dán Acc:"); if(!i) return; i.split('\n').forEach(l=>{ let p=l.trim().split(/[|:-]+/); if(p.length>=2) d.accounts["Acc"+Date.now()+Math.random()]=p[0].trim()+"|"+p[1].trim(); }); alert("Đã thêm!"); luu(d); }
            else if(type=='GIA') { d.giaAcc=parseInt(prompt("Giá:")); luu(d); }
            else if(type=='RESET') { if(confirm("XÓA HẾT?")) luu({users:{"User123":{balance:0}}, codes:{}, accounts:{}, giaAcc:400000}); }
        }
    </script>
</body>
</html>
