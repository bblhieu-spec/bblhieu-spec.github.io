<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOP ĐẾ VƯƠNG - LIÊN QUÂN</title>
    <style>
        html { zoom: 1.2; }
        body { background: #050505; color: #ffd700; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; overflow-x: hidden; }
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; width: 100%; height: 100%; }
        .box { background: linear-gradient(135deg, #220000, #000); border: 2px solid #ffd700; border-radius: 15px; padding: 15px; margin: 10px 0; box-shadow: 0 0 15px #ffd700; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #000; color: #ffd700; border: 1px solid #ffd700; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .btn:active { transform: scale(0.95); background: #330000; }
        .log-box { background: #000; color: #0f0; padding: 10px; border-radius: 5px; text-align: left; font-size: 13px; max-height: 120px; overflow-y: auto; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <h1>SHOP ĐẾ VƯƠNG</h1>
    <div class="box">
        <h2 id="bal">Đang khởi tạo...</h2>
        <div id="kho-acc">📦 Kho: Đang tải...</div>
        <button class="btn" onclick="guiNap()">1. NẠP TIỀN</button>
        <button class="btn" onclick="nhapCode()">2. NHẬP MÃ QUÀ</button>
    </div>
    
    <button class="btn" onclick="hanhDong('QUAY')">3. VÒNG QUAY 🐉</button>
    <button class="btn" onclick="hanhDong('MUA')">4. MUA ACC VIP (RANDOM) 🎰</button>
    
    <button class="btn" style="background:#555;" onclick="toggleLog('mem-log')">👥 LỊCH SỬ THÀNH VIÊN</button>
    <div id="mem-log" class="log-box" style="display:none;"></div>
    
    <button class="btn" style="background:#555;" onclick="toggleLog('acc-log')">📜 LỊCH SỬ MUA ACC</button>
    <div id="acc-log" class="log-box" style="display:none;"></div>
    
    <h3>🔔 GIAO DỊCH:</h3>
    <div id="notify-log" class="log-box"></div>
    
    <div id="admin-panel" style="display:none; border:2px dashed #fff; padding:15px; margin-top:20px;">
        <button class="btn" onclick="alert('Ví Admin: ' + (d.AdminWallet || 0))">💰 VÍ ADMIN</button>
        <button class="btn" onclick="adminAction('TAO')">TẠO MÃ</button>
        <button class="btn" onclick="adminAction('THEM')">THÊM ACC</button>
        <button class="btn" onclick="adminAction('TIEN')">CHỈNH TIỀN KHÁCH</button>
        <button class="btn" onclick="adminAction('GIA')" style="background:#550000;">⚙️ CHỈNH GIÁ MUA ACC</button>
        <button class="btn" onclick="adminAction('RESET_ALL')" style="color:red;">RESET TẤT CẢ</button>
    </div>
    <div onclick="moAdmin()" style="margin-top:30px; font-size:10px; color:#555; cursor:pointer;">©¤NGONGOCHUNG SYSTEM.●</div>

    <script>
        const B = "6a104353ee5a733b12ffcdf5", KEY = "$2a$10$w2vogPsNVk6QlFdnS0ZCwuHcD/tdk9fPnLZB0fCAcJMGFBklvUyrS".trim();
        let d = null;
        
        // Cải tiến: Ép khách nhập tên để bạn nhận diện được khách
        let ip = localStorage.getItem('myId');
        if (!ip) {
            ip = prompt("Nhập tên hiển thị của bạn để vào shop:");
            if (!ip) ip = "Khách_" + Math.random().toString(36).substr(2, 5);
            localStorage.setItem('myId', ip);
        }

        async function load() {
            let r = await fetch("https://api.jsonbin.io/v3/b/"+B+"/latest");
            d = (await r.json()).record;
            if(!d.users) d.users = {};
            if(!d.users[ip]) { d.users[ip] = {balance:0}; d.memberLog = "👤 "+ip+" | "+new Date().toLocaleTimeString()+"\n"+(d.memberLog||""); luu(d); }
            document.getElementById('bal').innerText = "Số dư: " + (d.users[ip].balance || 0).toLocaleString() + "đ";
            document.getElementById('kho-acc').innerText = "📦 Kho: " + Object.keys(d.accounts || {}).length + " Acc";
            document.getElementById('notify-log').innerText = d.notifyLog || "Trống.";
            document.getElementById('acc-log').innerText = d.accLog || "Trống.";
            document.getElementById('mem-log').innerText = d.memberLog || "Trống.";
        } load();

        async function luu(data) { await fetch("https://api.jsonbin.io/v3/b/"+B, { method: "PUT", headers: {"Content-Type":"application/json", "X-Master-Key": KEY}, body: JSON.stringify(data) }); load(); }

        async function guiNap() { 
            let nd = prompt("Nội dung nạp:"); if(nd) { d.notifyLog = "🔔 "+ip+": "+nd+"\n"+d.notifyLog; await luu(d); alert("Đã gửi!"); } 
        }

        async function nhapCode() {
            let c = prompt("Mã:"); if(!c) return;
            if(d.codes && d.codes[c] && d.codes[c].limit > 0) {
                d.users[ip].balance += d.codes[c].val; d.codes[c].limit--;
                d.notifyLog = "💎 "+ip+": +"+d.codes[c].val+"\n"+d.notifyLog;
                await luu(d); alert("Thành công: +"+d.codes[c].val+"đ");
            } else alert("Mã sai!");
        }

        async function hanhDong(t) {
            if(t=='QUAY') {
                if(d.users[ip].balance < 10000) return alert("Thiếu tiền!");
                let v = (Math.random() < 0.2 ? 50000 : 0);
                d.users[ip].balance -= 10000; d.users[ip].balance += v;
                d.notifyLog = "🐉 "+ip+": "+(v>0? "+"+v : "Trượt")+"\n"+d.notifyLog;
                await luu(d); alert(v>0? "Trúng "+v : "Trượt!");
            } else {
                let ks = Object.keys(d.accounts || {});
                if(ks.length==0) return alert("Hết acc!");
                let rk = ks[Math.floor(Math.random() * ks.length)];
                let gia = (d.giaAcc || 400000);
                if(d.users[ip].balance < gia) return alert("Thiếu tiền!");
                d.users[ip].balance -= gia; d.AdminWallet = (d.AdminWallet || 0) + gia;
                d.accLog = "🎰 "+ip+" mua: "+d.accounts[rk]+"\n"+d.accLog;
                let acc = d.accounts[rk];
                delete d.accounts[rk];
                alert("Thành công: "+acc); 
                await luu(d);
            }
        }
        
        function moAdmin() { if(prompt("Pass:") === "HUNGDEVUONG") document.getElementById('admin-panel').style.display = 'block'; }
        
        async function adminAction(type) {
            if(type=='TAO') { let m=prompt("Mã:"), v=prompt("Tiền:"), sl=prompt("SL:"); d.codes[m]={limit:parseInt(sl), val:parseInt(v)}; luu(d); }
            else if(type=='THEM') { 
                let i=prompt("Dán Acc:"); 
                if(i) {
                    let c=0; i.split('\n').forEach(l => {
                        let idx = l.trim().search(/[|:.]/);
                        if(idx>0) { d.accounts["Acc"+Date.now()+"_"+c] = l.substring(0,idx).trim()+"|"+l.substring(idx+1).trim(); c++; }
                    });
                    await luu(d); alert("Đã thêm "+c+" acc!");
                }
            }
            else if(type=='TIEN') { let n=prompt("ID khách:"), s=parseInt(prompt("Tiền:")); if(d.users[n]) { d.users[n].balance=s; luu(d); alert("Xong!"); } }
            else if(type=='GIA') { let g = prompt("Giá mới:"); if(g) { d.giaAcc = parseInt(g); luu(d); alert("Xong!"); } }
            else if(type=='RESET_ALL') { if(confirm("RESET?")) { await luu({users:{}, AdminWallet:0, codes:{}, accounts:{}, notifyLog:"Reset", accLog:"Reset", memberLog:"Reset"}); alert("Xong!"); location.reload(); } }
        }
        function toggleLog(id) { let x = document.getElementById(id); x.style.display = (x.style.display === 'none') ? 'block' : 'none'; }
    </script>
</body>
</html>
